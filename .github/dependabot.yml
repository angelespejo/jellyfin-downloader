version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      svelte:
        patterns:
          - 'svelte*'
          - '@sveltejs/*'
      tooling:
        patterns:
          - 'prettier*'
          - 'oxlint'
          - 'typescript'
          - 'vite'
          - 'tsx'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
